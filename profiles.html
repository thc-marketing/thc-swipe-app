<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Profiles — Tokyo Hentai Club</title><style>
:root{color-scheme:dark;--bg:#100c12;--panel:#1d1720;--line:#392b3b;--text:#fff8fc;--muted:#bcaebb;--gold:#d9b36c;--pink:#ec4d9b;--green:#5bd4a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#392039 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{width:min(100% - 36px,1180px);margin:auto;padding:24px 0 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{color:var(--gold);font-weight:850;letter-spacing:.12em;text-decoration:none;font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{border:1px solid var(--line);border-radius:999px;padding:9px 15px;color:var(--muted);text-decoration:none;background:transparent;font-size:13px;font-weight:750}.nav a.active,.btn.primary{background:var(--gold);border-color:var(--gold);color:#1b1219}
h1{font-size:clamp(30px,5vw,44px);line-height:1.1;margin:30px 0 8px}.muted{color:var(--muted);font-size:13px}
.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 180px 180px;gap:10px;margin:22px 0 28px}.toolbar input,.toolbar select{width:100%;min-width:0;padding:13px 14px;background:#1b151e;border:1px solid var(--line);border-radius:11px;color:var(--text);font:inherit;outline:none}.toolbar input:focus,.toolbar select:focus{border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.girl{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,#251b29,#19131c);transition:transform .18s,border-color .18s}.girl:hover{transform:translateY(-3px);border-color:#9a6685}.girl img{width:100%;height:270px;object-fit:cover;background:#302332;display:block;transition:transform .3s}.girl:hover img{transform:scale(1.035)}.info{padding:13px}.name{font-size:18px;font-weight:850}.meta{color:var(--muted);font-size:12px;margin:5px 0 10px}.status{font-size:12px;font-weight:800;color:#8df0c1;margin:8px 0 12px}.status.later{color:#ffdb91}.actions{display:flex;gap:8px}.actions a{flex:1;text-align:center;padding:10px 7px;border-radius:9px;background:#302431;color:var(--text);text-decoration:none;font-size:12px;font-weight:800}.actions a.book{background:linear-gradient(100deg,#f16caf,#df3e91);color:#210f1b}.section-title{margin:28px 0 10px;font-size:17px;letter-spacing:.08em}.empty{padding:22px;border:1px dashed var(--line);border-radius:13px;color:var(--muted);text-align:center}
@media(max-width:620px){.wrap{width:min(100% - 24px,1180px);padding-top:16px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.girl img{height:210px}.info{padding:10px}.name{font-size:15px}.actions{gap:6px}.actions a{font-size:11px;padding:9px 4px}}
@media(max-width:360px){.girl img{height:175px}.nav a{padding:8px 10px;font-size:11px}}</style></head>
<body><main class="wrap"><header><a class="brand" href="./profiles.html">TOKYO HENTAI CLUB</a><nav class="nav"><a class="active" href="./profiles.html">All Profiles</a><a class="" href="./available.html">Available Today</a></nav><a href="/index.html" style="color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:700">⌂ Back to Homepage</a></header>
<h1>All Profiles</h1><p class="muted">Browse the complete imported profile directory.</p>
<div class="toolbar"><input id="search" type="search" placeholder="Search by name or profile ID"><select id="area"><option value="">All areas</option><option value="shinjuku">Shinjuku</option><option value="shibuya">Shibuya</option></select><select id="rank"><option value="">All ranks</option><option>Silver</option><option>Gold</option><option>Diamond</option><option>AV Star</option></select></div>
<div id="content" class="grid"><div class="empty">Loading profiles…</div></div><p id="foot" class="muted"></p></main>
<script>
const mode="all";
const content=document.getElementById('content');
let profiles=[];
function isNow(p){return /available now/i.test(p.status||'')}
function isLater(p){return /next appointment|available later/i.test(p.status||'')}
function card(p){const later=!isNow(p);const el=document.createElement('article');el.className='girl';const img=document.createElement('img');img.loading='lazy';img.src=p.photo||'';img.alt=(p.displayName||'Profile')+' profile photo';img.onerror=()=>{img.style.display='none'};const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=(p.displayName||'')+(p.age?' ('+p.age+')':'');const meta=document.createElement('div');meta.className='meta';meta.textContent=[p.rank,p.area,'ID '+p.id].filter(Boolean).join(' · ');const status=document.createElement('div');status.className='status '+(later?'later':'');status.textContent=p.status||'Check availability';const actions=document.createElement('div');actions.className='actions';const view=document.createElement('a');view.href='./browse.html?profile='+encodeURIComponent(p.id);view.textContent='View Profile';const book=document.createElement('a');book.className='book';book.href='./browse.html?booking=1&id='+encodeURIComponent(p.id);book.textContent='Book';actions.append(view,book);info.append(name,meta,status,actions);el.append(img,info);return el}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const area=document.getElementById('area').value;const rank=document.getElementById('rank').value;let list=profiles.filter(p=>{const hay=[p.displayName,p.id,p.area,p.rank].join(' ').toLowerCase();return (!q||hay.includes(q))&&(!area||String(p.area||'').toLowerCase().includes(area))&&(!rank||p.rank===rank)});if(mode==='today')list=list.filter(p=>isNow(p)||isLater(p));content.replaceChildren();if(mode==='today'){const now=list.filter(isNow),later=list.filter(p=>!isNow(p));for(const [label,items] of [['AVAILABLE NOW',now],['AVAILABLE LATER',later]]){const h=document.createElement('h2');h.className='section-title';h.textContent=label+' ('+items.length+')';content.append(h);if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No profiles in this section.';content.append(empty)}else{const grid=document.createElement('div');grid.className='grid';items.forEach(p=>grid.append(card(p)));content.append(grid)}}}else{if(!list.length){content.innerHTML='<div class="empty">No matching profiles found.</div>'}else list.forEach(p=>content.append(card(p)))}document.getElementById('foot').textContent=list.length+' profiles shown. Availability is based on the imported profile snapshot and may need staff confirmation.'}
['search','area','rank'].forEach(id=>document.getElementById(id).addEventListener('input',render));
fetch('./profiles.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Invalid profile data');profiles=data;render()}).catch(e=>{content.innerHTML='<div class="empty">Could not load profiles: '+e.message+'</div>'});
</script></body></html>
