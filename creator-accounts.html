<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THC Creator Accounts</title><style>
:root{color-scheme:dark;--bg:#0d0b10;--panel:#19151d;--line:#493447;--text:#fff8fc;--muted:#b8aab7;--pink:#f24d98}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.wrap{width:min(100% - 30px,900px);margin:auto;padding:28px 0}h1{font-size:30px}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px;margin:10px 0;border:1px solid #ffffff20;border-radius:13px;background:var(--panel)}button{padding:10px 14px;border:0;border-radius:9px;background:linear-gradient(110deg,#f66bab,#e83f8d);font-weight:800;cursor:pointer}.result{padding:15px;border:1px solid #f24d9855;border-radius:12px;margin:14px 0;background:var(--panel)}code{color:#ffafd0}a{color:#ff91c2}@media(max-width:560px){.row{align-items:flex-start;flex-direction:column}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><p class="muted">TOKYO HENTAI CLUB · ADMIN</p><h1>Creator account setup</h1><p class="muted">Create individual Creator Hub logins for published, active profiles. Give each creator their ID and temporary password privately.</p><div id="status" class="muted">Checking administrator access…</div><div id="list"></div><div id="result"></div><p><a href="creator-hub.html">Back to Creator Studio</a></p></main>
<script>
(()=>{const db=window.supabase.createClient('https://dvvyqpdaoprzrarotuin.supabase.co','sb_publishable_Gr1caEBRuLlT-ieg8Ssh1A_DOurj_24');const $=id=>document.getElementById(id);
async function init(){const {data:{user},error}=await db.auth.getUser();if(error||!user){$('status').textContent='Sign in with the THC administrator account first.';return}const {data:admin,error:ae}=await db.from('creator_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(ae||!admin){$('status').textContent='Access denied. This account is not a THC administrator.';return}const {data:rows,error:re}=await db.from('companion_profiles').select('id,display_name,creator_user_id').eq('is_active',true).eq('is_published',true).order('display_name');if(re){$('status').textContent=re.message;return}$('status').textContent=rows.length+' active published profiles. Accounts already linked are marked as created.';for(const p of rows){const line=document.createElement('div');line.className='row';const name=document.createElement('div');name.innerHTML='<strong></strong><div class="muted"></div>';name.firstChild.textContent=p.display_name;name.lastChild.textContent=p.creator_user_id?'Account linked':'No creator login yet';const btn=document.createElement('button');btn.textContent=p.creator_user_id?'Already created':'Create login';btn.disabled=!!p.creator_user_id;btn.onclick=()=>create(p,btn);line.append(name,btn);$('list').append(line)}}
async function create(p,btn){if(!confirm('Create a Creator Hub login for '+p.display_name+'?'))return;btn.disabled=true;btn.textContent='Creating…';$('result').replaceChildren();try{const {data,error}=await db.functions.invoke('creator-account-admin',{body:{companion_profile_id:p.id}});if(error)throw error;if(!data?.creator_id)throw new Error(data?.error||'The function did not return account credentials.');const card=document.createElement('div');card.className='result';const title=document.createElement('strong');title.textContent='Account created for '+p.display_name;const id=document.createElement('p');id.innerHTML='Creator ID: <code></code>';id.querySelector('code').textContent=data.creator_id;const pw=document.createElement('p');pw.innerHTML='Temporary password: <code></code>';pw.querySelector('code').textContent=data.temporary_password;const note=document.createElement('p');note.className='muted';note.textContent='Share these credentials privately. The creator must change the password at first login.';const copy=document.createElement('button');copy.textContent='Copy credentials';copy.onclick=()=>navigator.clipboard.writeText('Creator ID: '+data.creator_id+'\nTemporary password: '+data.temporary_password);card.append(title,id,pw,note,copy);$('result').append(card);btn.textContent='Created'}catch(err){$('status').textContent='Could not create account: '+(err.message||String(err));btn.disabled=false;btn.textContent='Retry'}}init()})();
</script></body></html>
