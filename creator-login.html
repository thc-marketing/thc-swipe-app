<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THC Creator Login</title>
<style>
:root{color-scheme:dark;--bg:#0d0b10;--panel:#19151d;--line:#493447;--text:#fff8fc;--muted:#b8aab7;--pink:#f24d98}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 80% 10%,#70234e55,transparent 40%),#0d0b10;color:var(--text);font:15px system-ui,sans-serif}.box{width:min(100%,440px);padding:30px;border:1px solid #f24d9855;border-radius:22px;background:linear-gradient(145deg,#211925,#151119)}h1{margin:8px 0}.muted{color:var(--muted);font-size:13px;line-height:1.6}.eyebrow{color:#ff91c2;font-size:10px;letter-spacing:.2em;font-weight:800}label{display:block;margin:16px 0 7px;font-size:12px}input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#100d14;color:white;font:inherit}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:linear-gradient(110deg,#f66bab,#e83f8d);color:#190d16;font-weight:900;cursor:pointer}button:disabled{opacity:.6}#message{min-height:22px;font-size:13px;color:#ff9eae;margin-top:12px}a{color:#ff91c2;font-size:12px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="box"><div class="eyebrow">TOKYO HENTAI CLUB · CREATOR STUDIO</div><h1 id="heading">Creator Login</h1><p class="muted" id="intro">Sign in with the Creator ID and temporary password provided by the THC team.</p>
<form id="form"><div id="loginFields"><label for="creatorId">Creator ID</label><input id="creatorId" autocomplete="username" required placeholder="thc-yourname"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<div id="changeFields" hidden><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password"></div>
<button id="submit" type="submit">LOG IN</button></form><div id="message" role="status" aria-live="polite"></div><p><a href="login.html">← Customer login</a></p></main>
<script>
(()=>{const db=window.supabase.createClient('https://dvvyqpdaoprzrarotuin.supabase.co','sb_publishable_Gr1caEBRuLlT-ieg8Ssh1A_DOurj_24');const $=id=>document.getElementById(id);let changing=false;
const emailFor=id=>id.trim().toLowerCase().replace(/^@/,'')+'@creator.thc.invalid';
function message(t,error=true){$('message').textContent=t;$('message').style.color=error?'#ff9eae':'#a8e6bd'}
function showChange(){changing=true;$('heading').textContent='Set your new password';$('intro').textContent='For your security, change the temporary password before entering Creator Studio.';$('loginFields').hidden=true;$('changeFields').hidden=false;$('newPassword').required=true;$('confirmPassword').required=true;$('submit').textContent='SAVE NEW PASSWORD'}
async function validateCreator(){const {data:{user},error}=await db.auth.getUser();if(error||!user)return false;const {data:p,error:pe}=await db.from('creator_profiles').select('is_creator,is_approved').eq('user_id',user.id).maybeSingle();if(pe)throw pe;if(!p?.is_creator||!p?.is_approved)throw new Error('This login is not linked to an approved creator profile. Contact the THC team.');return user}
$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit');b.disabled=true;message('');try{if(!changing){const id=$('creatorId').value.trim().toLowerCase();if(!/^thc-[a-z0-9-]+$/.test(id))throw new Error('Enter your Creator ID in the format thc-yourname.');const {data,error}=await db.auth.signInWithPassword({email:emailFor(id),password:$('password').value});if(error)throw error;await validateCreator();const {data:sec,error:se}=await db.from('creator_account_security').select('must_change_password').eq('user_id',data.user.id).maybeSingle();if(se)throw se;if(sec?.must_change_password){showChange();message('Please create a new password to continue.',false)}else location.href='creator-hub.html'}else{const a=$('newPassword').value,c=$('confirmPassword').value;if(a.length<8)throw new Error('Use at least 8 characters.');if(a!==c)throw new Error('The passwords do not match.');const user=await validateCreator();const {data:changed,error:changeError}=await db.functions.invoke('creator-password-change',{body:{password:a}});if(changeError)throw changeError;if(!changed?.success)throw new Error(changed?.error||'Could not update your password.');message('Password updated. Opening your studio…',false);location.href='creator-hub.html'}}catch(err){await db.auth.signOut({scope:'local'});message(err.message||'Unable to sign in.')}finally{b.disabled=false;b.textContent=changing?'SAVE NEW PASSWORD':'LOG IN'}};
db.auth.getUser().then(async({data,error})=>{
 if(error||!data?.user)return;
 try{
  await validateCreator();
  const {data:s,error:se}=await db.from('creator_account_security').select('must_change_password').eq('user_id',data.user.id).maybeSingle();
  if(se)throw se;
  if(s?.must_change_password)showChange();else location.replace('creator-hub.html');
 }catch(e){await db.auth.signOut({scope:'local'});message('Creator access could not be verified. Please sign in with an approved creator account.');}
});
if(new URLSearchParams(location.search).get('change')==='1'){$('intro').textContent='Your account requires a password change. Sign in with your temporary credentials first.'}
})();
</script></body></html>
