</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style id="thc-unified-theme">

<body><main class="wrap"><header><strong>TOKYO HENTAI CLUB</strong><a href="customer-feed.html">← Creator Feed</a></header>
<div id="status" class="status">Loading creator profile…</div><section id="profile" class="card" hidden><div class="profile"><img id="avatar" class="avatar" alt="Creator profile photo"><div><h1 id="name" style="margin:0 0 5px"></h1><p id="bio" class="muted"></p><button id="follow" class="primary">＋ Follow</button></div></div><div class="stats"><div><strong id="postCount">0</strong><span class="muted">Posts</span></div><div><strong id="followerCount">0</strong><span class="muted">Followers</span></div><div><strong id="likeCount">0</strong><span class="muted">Likes</span></div></div></section><h2 id="postsHeading" hidden>Posts</h2><section id="posts"></section></main>
<script>
(()=>{const URL='https://dvvyqpdaoprzrarotuin.supabase.co',KEY='sb_publishable_Gr1caEBRuLlT-ieg8Ssh1A_DOurj_24',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),creatorId=new URLSearchParams(location.search).get('id');
async function run(){if(!creatorId){$('status').textContent='Choose a creator from the feed to view their profile.';return}
const {data:profile,error}=await db.from('creator_profiles').select('user_id,display_name,bio,avatar_url').eq('user_id',creatorId).eq('is_creator',true).eq('is_approved',true).maybeSingle();if(error||!profile){$('status').textContent=error?'Could not load profile: '+error.message:'This creator profile is unavailable.';return}
$('status').hidden=true;$('profile').hidden=false;$('postsHeading').hidden=false;$('name').textContent=profile.display_name;$('bio').textContent=profile.bio||'Tokyo Hentai Club creator';if(profile.avatar_url)$('avatar').src=profile.avatar_url;
const {count:followerCount}=await db.from('creator_follows').select('*',{count:'exact',head:true}).eq('creator_id',creatorId);$('followerCount').textContent=followerCount||0;
const {data:auth}=await db.auth.getUser();let following=false;if(auth?.user){const {data:rel}=await db.from('creator_follows').select('creator_id').eq('creator_id',creatorId).eq('follower_id',auth.user.id).maybeSingle();following=!!rel}
$('follow').textContent=following?'✓ Following':'＋ Follow';$('follow').onclick=async()=>{const {data:a}=await db.auth.getUser();if(!a?.user){alert('Please sign in first.');return}const action=following?db.from('creator_follows').delete().eq('creator_id',creatorId).eq('follower_id',a.user.id):db.from('creator_follows').insert({creator_id:creatorId,follower_id:a.user.id});const {error}=await action;if(error){alert(error.message);return}following=!following;$('follow').textContent=following?'✓ Following':'＋ Follow';const {count}=await db.from('creator_follows').select('*',{count:'exact',head:true}).eq('creator_id',creatorId);$('followerCount').textContent=count||0};
const {data:posts,error:pe}=await db.from('creator_posts').select('id,caption,media_url,media_type,published_at').eq('creator_id',creatorId).eq('status','published').eq('is_paid',false).order('published_at',{ascending:false});if(pe){$('posts').textContent='Could not load posts: '+pe.message;return}
$('postCount').textContent=(posts||[]).length;let totalLikes=0;
for(const p of posts||[]){const {data:signed}=await db.storage.from('creator-media').createSignedUrl(p.media_url,3600);const card=document.createElement('article');card.className='post';const caption=document.createElement('p');caption.textContent=p.caption||'';card.append(caption);if(signed?.signedUrl){const media=document.createElement(p.media_type==='video'?'video':'img');media.src=signed.signedUrl;if(p.media_type==='video'){media.controls=true;media.playsInline=true}else{media.alt='Creator post';media.loading='lazy'}card.append(media)}
const {data:eng}=await db.rpc('get_free_post_engagement',{p_post_id:p.id});const e=Array.isArray(eng)?eng[0]:eng;totalLikes+=Number(e?.like_count||0);const meta=document.createElement('p');meta.className='muted';meta.textContent=(e?.like_count||0)+' likes · '+(e?.comment_count||0)+' comments · '+(p.published_at?new Date(p.published_at).toLocaleDateString():'');card.append(meta);$('posts').append(card)}
$('likeCount').textContent=totalLikes;
}
run().catch(e=>{$('status').textContent='Profile error: '+(e.message||String(e))});
})();
</script></body></html>
