<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THC Live</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.13.3/dist/livekit-client.umd.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0d0b10;--panel:#19151d;--line:#382b39;--text:#fff8fc;--muted:#b8aab7;--pink:#f24d98}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#55244755,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{width:min(100% - 28px,1000px);margin:25px auto 60px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff20;padding-bottom:14px}a{color:#ff91c2}.brand{color:#fff;text-decoration:none;font-weight:900;letter-spacing:.12em}.muted{color:var(--muted);font-size:13px}.card{padding:18px;border:1px solid #ffffff20;border-radius:16px;background:linear-gradient(145deg,#211925,#151119);margin:14px 0}h1{font-size:clamp(30px,5vw,44px);margin:26px 0 4px}.field{display:block;width:100%;padding:12px;margin:8px 0 14px;background:#100d14;border:1px solid #493447;border-radius:10px;color:white;font:inherit}button{border:1px solid #ffffff25;border-radius:10px;padding:11px 15px;background:#211925;color:white;font-weight:800;cursor:pointer}.primary{background:linear-gradient(110deg,#f66bab,#e83f8d);color:#190d16;border:0}.danger{border-color:#a94465;color:#ff9abb}.live-pill{color:#ff7aa9;font-weight:900;letter-spacing:.12em}.session{display:flex;justify-content:space-between;align-items:center;gap:12px}.session h3{margin:0 0 5px}.session p{margin:0}.hidden{display:none!important}#videoGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}#videoGrid video{width:100%;max-height:480px;aspect-ratio:16/9;object-fit:cover;background:#050407;border-radius:12px}.chat{height:240px;overflow:auto;background:#100d14;border:1px solid #ffffff15;border-radius:10px;padding:10px}.msg{padding:6px 0;border-bottom:1px solid #ffffff10;font-size:13px;overflow-wrap:anywhere}.msg b{color:#ff91c2}.chatrow{display:flex;gap:8px;margin-top:8px}.chatrow input{flex:1;min-width:0}.chatrow button{white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:560px){.session{align-items:flex-start;flex-direction:column}.chatrow{flex-wrap:wrap}.chatrow button{width:100%}}
</style></head>
<body><main class="wrap">
<header><a class="brand" href="./creator-hub.html">TOKYO HENTAI CLUB</a></header>
<h1>THC <span style="color:var(--pink)">LIVE</span></h1><p class="muted">Live chats, Q&As and behind-the-scenes sessions with approved creators.</p>
<section id="startCard" class="card hidden"><h2>Go Live</h2><label>Stream title<input id="liveTitle" class="field" maxlength="80" placeholder="What are you chatting about?"></label><label>Description (optional)<textarea id="liveDescription" class="field" maxlength="240" rows="2" placeholder="Tell viewers what to expect"></textarea></label><button id="startLive" class="primary">Start livestream</button></section>
<section id="myLiveRequests" class="card hidden"><h2>My livestreams & requests</h2><div id="myLiveRequestsList" class="muted">Loading your livestream records…</div></section>
<section id="status" class="muted card">Checking your account…</section>
<section id="liveList"><h2>Live now</h2><div id="sessions"></div></section>
<section id="room" class="card hidden"><div class="session"><div><span class="live-pill">● LIVE</span><h2 id="roomTitle">Live room</h2><p id="roomDescription" class="muted"></p></div><div class="actions"><button id="report" type="button">Report</button><button id="leave" type="button">Leave</button><button id="end" class="danger hidden" type="button">End stream</button></div></div>
<div id="videoGrid"></div><h3>Live chat</h3><div id="chat" class="chat" aria-live="polite"></div><form id="chatForm" class="chatrow"><input id="chatInput" class="field" maxlength="500" placeholder="Write a message…" required><button class="primary">Send</button></form></section>
</main>
<script>
(async()=>{
const URL='https://dvvyqpdaoprzrarotuin.supabase.co',KEY='sb_publishable_Gr1caEBRuLlT-ieg8Ssh1A_DOurj_24';
const db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
let user=null,room=null,current=null,chatTimer=null,creator=false;
const say=t=>$('status').textContent=t;
async function api(action,extra={}){const {data:{session}}=await db.auth.getSession();if(!session?.access_token)throw new Error('Please sign in again.');const res=await fetch(URL+'/functions/v1/thc-live-control',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({action,...extra})});const out=await res.json();if(!res.ok)throw new Error(out.error||'Livestream request failed.');return out}
async function loadMyLiveRequests(){
 if(!creator)return;
 const box=$('myLiveRequestsList');box.textContent='Loading your livestream records…';
 try{
  const result=await api('list_mine');box.replaceChildren();
  if(!result.requests?.length){box.textContent='You have no previous livestream requests.';$('myLiveRequests').classList.remove('hidden');return}
  for(const item of result.requests){
   const card=document.createElement('div');card.className='card';
   const title=document.createElement('h3');title.textContent=item.title||'Untitled livestream';
   const meta=document.createElement('p');meta.className='muted';meta.textContent='Status: '+String(item.status).toUpperCase()+' · '+new Date(item.created_at).toLocaleString();
   const actions=document.createElement('div');actions.className='actions';
   if(item.status==='live'){
    const end=document.createElement('button');end.className='danger';end.textContent='End stream';
    end.onclick=async()=>{if(!confirm('End your livestream now?'))return;end.disabled=true;try{await api('end',{sessionId:item.id});await loadMyLiveRequests();await loadSessions();say('Your livestream has ended.')}catch(e){say(e.message);end.disabled=false}};actions.append(end);
   }
   if(item.status!=='live'){
    const del=document.createElement('button');del.className='danger';del.textContent='Delete request';
    del.onclick=async()=>{if(!confirm('Delete this livestream record?'))return;del.disabled=true;try{await api('delete',{sessionId:item.id});await loadMyLiveRequests();say('Livestream record deleted.')}catch(e){say(e.message);del.disabled=false}};actions.append(del);
   }
   card.append(title,meta,actions);box.append(card);
  }
  $('myLiveRequests').classList.remove('hidden');
 }catch(e){box.textContent='Could not load your livestream records: '+e.message;$('myLiveRequests').classList.remove('hidden')}
}
async function loadSessions(){const {data,error}=await db.from('live_sessions').select('id,title,description,started_at,creator_id').eq('status','live').order('started_at',{ascending:false});if(error){$('sessions').textContent=error.message;return}const root=$('sessions');root.replaceChildren();if(!data?.length){root.innerHTML='<div class="card muted">No one is live right now. Check back soon.</div>';return}const ids=[...new Set(data.map(s=>s.creator_id).filter(Boolean))];let names=new Map();if(ids.length){const {data:profiles}=await db.from('creator_profiles').select('user_id,display_name').in('user_id',ids);names=new Map((profiles||[]).map(p=>[p.user_id,p.display_name]))}for(const s of data){const card=document.createElement('div');card.className='card session';const info=document.createElement('div');const title=document.createElement('h3');title.textContent=s.title;const desc=document.createElement('p');desc.className='muted';desc.textContent=(names.get(s.creator_id)||'THC Creator')+' · '+(s.description||'Live now');info.append(title,desc);const b=document.createElement('button');b.className='primary';b.textContent='Watch live';b.onclick=()=>join(s.id);card.append(info,b);root.append(card)}}
function attachTrack(track,participant,local=false){if(!track||track.kind!=='video')return;const el=track.attach();el.autoplay=true;el.playsInline=true;el.muted=local;el.dataset.participant=participant.identity;$('videoGrid').append(el)}
async function enter(data){current=data.session;room=new LivekitClient.Room({adaptiveStream:true,dynacast:true});room.on(LivekitClient.RoomEvent.TrackSubscribed,(track,p)=>attachTrack(track,p));room.on(LivekitClient.RoomEvent.TrackUnsubscribed,(track)=>track.detach().forEach(el=>el.remove()));room.on(LivekitClient.RoomEvent.Disconnected,()=>{$('videoGrid').replaceChildren()});await room.connect(data.serverUrl,data.token);$('roomTitle').textContent=current.title;$('roomDescription').textContent=current.description||'';$('room').classList.remove('hidden');$('liveList').classList.add('hidden');$('startCard').classList.add('hidden');$('end').classList.toggle('hidden',data.role!=='creator');if(data.role==='creator'){await room.localParticipant.setCameraEnabled(true);await room.localParticipant.setMicrophoneEnabled(true);for(const pub of room.localParticipant.trackPublications.values()){if(pub.track&&pub.kind==='video')attachTrack(pub.track,room.localParticipant,true)}}for(const p of room.remoteParticipants.values())for(const pub of p.trackPublications.values())if(pub.track)attachTrack(pub.track,p);await loadChat();if(chatTimer)clearInterval(chatTimer);chatTimer=setInterval(loadChat,3000)}
async function join(id){try{say('Connecting to livestream…');const data=await api('join',{sessionId:id});await enter(data);say('You joined the livestream.')}catch(e){say(e.message)}}
async function loadChat(){if(!current)return;const {data,error}=await db.from('live_chat_messages').select('id,user_id,message,created_at').eq('live_session_id',current.id).order('created_at',{ascending:true}).limit(100);if(error)return;const box=$('chat');box.replaceChildren();for(const m of data||[]){const line=document.createElement('div');line.className='msg';const who=document.createElement('b');who.textContent=m.user_id===user.id?'You':'Member';line.append(who,document.createTextNode(': '+m.message));box.append(line)}box.scrollTop=box.scrollHeight}
$('chatForm').onsubmit=async e=>{e.preventDefault();if(!current)return;const value=$('chatInput').value.trim();if(!value)return;const {error}=await db.from('live_chat_messages').insert({live_session_id:current.id,user_id:user.id,message:value});if(error){say(error.message);return}$('chatInput').value='';await loadChat()};
async function leave(){if(chatTimer)clearInterval(chatTimer);chatTimer=null;if(room){await room.disconnect();room=null}current=null;$('room').classList.add('hidden');$('liveList').classList.remove('hidden');if(creator)$('startCard').classList.remove('hidden');await loadSessions()}
$('leave').onclick=leave;
$('end').onclick=async()=>{if(!current)return;try{await api('end',{sessionId:current.id});await leave();say('Livestream ended.')}catch(e){say(e.message)}};
$('report').onclick=async()=>{if(!current)return;const reason=prompt('What is the issue with this livestream?');if(!reason)return;const {error}=await db.from('live_room_reports').insert({live_session_id:current.id,reporter_id:user.id,reason:reason.slice(0,500)});say(error?error.message:'Report submitted. Thank you.')};
$('startLive').onclick=async()=>{try{const b=$('startLive');b.disabled=true;say('Sending livestream request…');const data=await api('start',{title:$('liveTitle').value,description:$('liveDescription').value});const requestId=data.session.id;say('Request sent to admin. Waiting for approval…');const wait=setInterval(async()=>{const {data:check}=await db.from('live_sessions').select('status').eq('id',requestId).maybeSingle();if(check?.status==='live'){clearInterval(wait);try{const live=await api('join',{sessionId:requestId,creatorMode:true});await enter(live);say('Your livestream is approved. You are live.')}catch(e){say(e.message)}}else if(check?.status==='ended'){clearInterval(wait);say('Your livestream request was not approved.')}},4000)}catch(e){say(e.message)}finally{$('startLive').disabled=false}};
try{const {data:{user:u},error}=await db.auth.getUser();if(error||!u){location.replace('./creator-login.html');return}user=u;const {data:p}=await db.from('creator_profiles').select('is_creator,is_approved').eq('user_id',u.id).maybeSingle();creator=!!p?.is_creator&&!!p?.is_approved;if(creator)$('startCard').classList.remove('hidden');else{location.replace('./creator-login.html');return;}say(creator?'Creator access approved. You can go live or watch a stream.':'Signed in. Choose a livestream to watch.');await loadSessions();await loadMyLiveRequests();setInterval(loadSessions,10000);setInterval(loadMyLiveRequests,15000)}catch(e){say(e.message)}
})();
</script></body></html>
