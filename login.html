<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in · Tokyo Hentai Club</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0d0b10;--pink:#f24d98;--violet:#8b62d9;--gold:#e8c17b;--text:#fff8fc;--muted:#b8aab7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 82% 12%,#55244766,transparent 38%),radial-gradient(ellipse at 8% 80%,#38245a66,transparent 42%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.page{width:min(100%,460px)}.brand{display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:25px;text-decoration:none;color:inherit}.brand img{width:62px;height:62px;object-fit:contain}.brand strong{display:block;font-size:13px;letter-spacing:.17em}.brand small{display:block;color:#ff91c2;font-size:9px;letter-spacing:.2em;margin-top:5px}
.panel{position:relative;overflow:hidden;padding:34px;border:1px solid #f24d9844;border-radius:23px;background:linear-gradient(145deg,#211925,#151119);box-shadow:0 25px 90px #000b,0 0 55px #e83f8d18}.panel:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--pink),var(--violet),var(--gold))}
.eyebrow{color:#ff91c2;font-size:10px;font-weight:900;letter-spacing:.2em}.panel h1{font-size:34px;letter-spacing:-.06em;margin:12px 0 8px}.intro{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 24px}
label{display:block;font-size:12px;font-weight:700;margin:15px 0 7px;color:#f0dce8}input[type=email],input[type=password],input[type=text]{width:100%;padding:14px;border:1px solid #493447;border-radius:11px;background:#100d14;color:var(--text);font:inherit;font-size:14px}input:focus{outline:1px solid var(--pink);border-color:var(--pink)}
.check{display:flex;align-items:flex-start;gap:9px;font-size:11px;line-height:1.5;color:var(--muted);font-weight:400}.check input{margin-top:3px}
.submit{width:100%;margin-top:20px;padding:15px;border:0;border-radius:11px;background:linear-gradient(110deg,#f66bab,#e83f8d);color:#190d16;font-weight:950;letter-spacing:.06em;cursor:pointer;box-shadow:0 8px 28px #e83f8d35}.submit:disabled{opacity:.6;cursor:wait}
.switch{text-align:center;color:var(--muted);font-size:12px;margin:20px 0 0}.switch button{border:0;background:none;color:#ff91c2;font:inherit;font-weight:800;cursor:pointer;text-decoration:underline}
#message{min-height:18px;font-size:12px;line-height:1.5;overflow-wrap:anywhere;margin:13px 0 0;color:#b8aab7}
.back{display:block;text-align:center;color:#ff91c2;text-decoration:none;font-size:12px;margin-top:20px}
@media(max-width:480px){.panel{padding:26px 22px}.panel h1{font-size:30px}}
</style></head>
<body><main class="page">
<a class="brand" href="./"><img src="thc-logo.png" alt="THC logo"><span><strong>TOKYO HENTAI CLUB</strong><small>YOUR TOKYO AFTER-DARK CLUB</small></span></a>
<section class="panel"><div class="eyebrow">WELCOME BACK · TOKYO AFTER DARK</div><h1 id="title">Log in.</h1><p class="intro" id="intro">Sign in to catch up with the girls, like and comment on free posts, and manage your purchases.</p>
<form id="authForm">
<div id="nameWrap" hidden><label for="name">Display name</label><input id="name" type="text" maxlength="60" autocomplete="nickname" placeholder="Your display name"></div>
<label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
<label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="Your password">
<label id="adultWrap" class="check" hidden><input id="adult" type="checkbox"><span>I confirm I am at least 18 years old and agree to the applicable terms and privacy policy.</span></label>
<button class="submit" id="submit" type="submit">LOG IN</button></form>
<p id="message" role="status" aria-live="polite"></p>
<p class="switch"><span id="switchText">New to THC?</span> <button id="switch" type="button">Create an account</button></p>
</section><a class="back" href="./">← Back to the creator feed</a>
</main>
<script>
(()=>{
const db=window.supabase.createClient("https://dvvyqpdaoprzrarotuin.supabase.co","sb_publishable_Gr1caEBRuLlT-ieg8Ssh1A_DOurj_24");
const $=id=>document.getElementById(id);let mode="login";
function say(t,error=false){$("message").textContent=t;$("message").style.color=error?"#ff9eae":"#b8aab7"}
function setMode(next){mode=next;const signup=mode==="signup";$("title").textContent=signup?"Join the club.":"Log in.";$("intro").textContent=signup?"Create your account to follow creator updates, join the conversation, and manage your purchases.":"Sign in to catch up with the girls, like and comment on free posts, and manage your purchases.";$("nameWrap").hidden=!signup;$("adultWrap").hidden=!signup;$("name").required=signup;$("adult").required=signup;$("password").autocomplete=signup?"new-password":"current-password";$("submit").textContent=signup?"CREATE ACCOUNT":"LOG IN";$("switchText").textContent=signup?"Already have an account?":"New to THC?";$("switch").textContent=signup?"Log in":"Create an account";say("")}
$("switch").onclick=()=>setMode(mode==="login"?"signup":"login");
$("authForm").onsubmit=async e=>{e.preventDefault();if(!$("authForm").reportValidity())return;const btn=$("submit");btn.disabled=true;btn.textContent="PLEASE WAIT…";say("");try{const email=$("email").value.trim(),password=$("password").value;let result;if(mode==="signup"){result=await db.auth.signUp({email,password,options:{data:{display_name:$("name").value.trim(),adult_confirmed:true}}})}else{result=await db.auth.signInWithPassword({email,password})}if(result.error)throw result.error;if(mode==="signup"&&!result.data.session){say("Account registration started. Check your email for a confirmation link, then log in.");setMode("login")}else{location.href="./"}}catch(err){say(err.message||"Something went wrong. Please try again.",true)}finally{btn.disabled=false;btn.textContent=mode==="signup"?"CREATE ACCOUNT":"LOG IN"}};
db.auth.getSession().then(({data,error})=>{if(error){say("Could not check your session: "+error.message,true);return}if(data.session)location.href="./"});
})();
</script></body></html>
